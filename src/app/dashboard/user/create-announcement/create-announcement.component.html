<section class="create-form">
  <div class="section-header">
    <div>
      <h2>Create new Announcement</h2>
      <p>Fill in the details of the food you want to donate or sell.</p>
    </div>
    <button mat-stroked-button color="primary" routerLink="/dashboard/announcements">
      <mat-icon>arrow_back</mat-icon>
      Back to list
    </button>
  </div>

  <mat-card>
    <form [formGroup]="announcementForm" (ngSubmit)="submit()">
      <div class="grid two">
        <mat-form-field appearance="fill">
          <mat-label>Food Title</mat-label>
          <input matInput formControlName="title" placeholder="Enter your Food title" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Food Category</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="grid three">
        <mat-form-field appearance="fill">
          <mat-label>Quantity</mat-label>
          <input matInput type="number" min="1" formControlName="quantity" />
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Unit</mat-label>
          <mat-select formControlName="unit">
            <mat-option *ngFor="let unit of units" [value]="unit">{{ unit }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Expiration Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="expirationDate" />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="grid two">
        <mat-form-field appearance="fill">
          <mat-label>Pickup Address</mat-label>
          <input matInput formControlName="pickupAddress" placeholder="Enter your Location" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Contact Number</mat-label>
          <input matInput formControlName="contactNumber" placeholder="(216) 24789235" />
        </mat-form-field>
      </div>

      <div class="grid two">
        <div class="file-input">
          <label>Donation Image</label>
          <button mat-stroked-button color="primary" type="button">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" />
            <mat-icon>upload</mat-icon>
            <span>{{ announcementForm.value.imageUrl ? 'Image Selected' : 'Upload Image' }}</span>
            <mat-progress-bar *ngIf="uploading" mode="indeterminate"></mat-progress-bar>
          </button>
        </div>

        <mat-form-field appearance="fill">
          <mat-label>Donation Type</mat-label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let type of types" [value]="type">{{ type }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="fill" *ngIf="announcementForm.value.type === 'PAID'">
        <mat-label>Price (TND / {{ announcementForm.value.unit }})</mat-label>
        <input matInput type="number" min="1" formControlName="pricePerUnit" />
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
          <mat-progress-spinner *ngIf="isSubmitting" diameter="20" mode="indeterminate"></mat-progress-spinner>
          <span *ngIf="!isSubmitting">Apply</span>
        </button>
      </div>
    </form>
  </mat-card>
</section>
