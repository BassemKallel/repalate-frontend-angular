<section class="admin-transactions-shell">
  <header>
    <div>
      <h2>Transactions</h2>
      <p>Surveillez les échanges entre marchands et associations.</p>
    </div>
  </header>

  <mat-card class="transactions-container">
    <div class="filters">
      <mat-form-field appearance="outline">
        <mat-label>Rechercher</mat-label>
        <input
          matInput
          placeholder="Référence, marchand ou association"
          [(ngModel)]="filterText"
          (ngModelChange)="applyFilters()"
        />
        <button mat-icon-button matSuffix *ngIf="filterText" (click)="filterText = ''; applyFilters()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Statut</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="applyFilters()">
          <mat-option value="all">Tous</mat-option>
          <mat-option value="En cours">En cours</mat-option>
          <mat-option value="Terminée">Terminée</mat-option>
          <mat-option value="Annulée">Annulée</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-stroked-button (click)="clearFilters()" class="reset-button">
        <mat-icon>refresh</mat-icon>
        Réinitialiser
      </button>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
      <ng-container matColumnDef="ref">
        <th mat-header-cell *matHeaderCellDef> Référence </th>
        <td mat-cell *matCellDef="let tx">{{ tx.ref }}</td>
      </ng-container>

      <ng-container matColumnDef="applicant">
        <th mat-header-cell *matHeaderCellDef> Marchand </th>
        <td mat-cell *matCellDef="let tx">{{ tx.applicant }}</td>
      </ng-container>

      <ng-container matColumnDef="association">
        <th mat-header-cell *matHeaderCellDef> Association </th>
        <td mat-cell *matCellDef="let tx">{{ tx.association }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Statut </th>
        <td mat-cell *matCellDef="let tx">
          <span class="status-chip" [ngClass]="tx.status.toLowerCase()">{{ tx.status }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
  </mat-card>
</section>
